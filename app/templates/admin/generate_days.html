{% extends "base.html" %}

{% block title %}Generate AI Plan | Ramskon{% endblock %}

{% block content %}
<section class="dashboard-header">
    <div>
        <h1>Generate 30-Day AI Plan</h1>
        <p class="muted">Select a course and let Groq generate the full daily flow.</p>
    </div>
</section>

<section class="dash-card form-card">
    <form method="POST" class="auth-form">
        <select name="course_id" required>
            <option value="">Select a course</option>
            {% for course in courses %}
            <option value="{{ course.id }}">{{ course.title }}</option>
            {% endfor %}
        </select>
        <button type="submit" class="btn btn-primary full-width">Generate Full 30-Day Plan</button>
    </form>
</section>
{% endblock %}
